name: Daily Pain Radar report

# Runs the full pipeline (collect -> filter -> report) every morning and
# commits reports/DATE.md back to the repo, plus sends it to Telegram if
# TG_TOKEN/TG_CHAT_ID secrets are set.
#
# WHY MULTIPLE CRON TIMES + AN "ALREADY DONE?" GATE (fixed 2026-09-24):
# GitHub Actions `schedule` is UTC-only AND best-effort - under load it
# fires minutes to HOURS late, or drops runs. The old gate demanded the
# London hour be EXACTLY 07, so on 2026-09-24 both crons fired ~5.5h late
# (11:33Z / 12:26Z), the gate saw hour 12/13, skipped every step, and the run
# still showed green - no report. Now: several crons through the morning,
# and the gate is "no report exists yet for today's date" (idempotent), so
# the first firing that lands does the work and every later one is a no-op.
# 06:00 + 07:00 UTC keep the intended ~7am London delivery in BST / GMT.
on:
  schedule:
    - cron: "0 6 * * *"    # 07:00 London during BST
    - cron: "0 7 * * *"    # 07:00 London during GMT
    - cron: "30 8 * * *"   # retry if the above were delayed/dropped
    - cron: "30 10 * * *"  # retry
    - cron: "30 13 * * *"  # last retry
  workflow_dispatch: {}   # manual "Run workflow" button - always runs

permissions:
  contents: write   # needed to commit reports/DATE.md back to the repo

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate - skip if today's report already exists
        id: gate
        run: |
          # UTC date matches radar/report.py's dt.date.today() on the runner.
          today="$(date -u +%F)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual run - always proceeding"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ -f "reports/$today.md" ]; then
            echo "reports/$today.md already exists - nothing to do."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "no report for $today yet - running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: python3 -m pip install -r requirements.txt

      - name: Stage 1 - collect
        if: steps.gate.outputs.should_run == 'true'
        run: python3 run.py collect

      - name: Stage 2 - filter
        if: steps.gate.outputs.should_run == 'true'
        run: python3 run.py filter --show 25

      # TEMPORARY DEBUG (2026-09-24): Telegram 404s on Actions. Prints only
      # lengths/booleans, never the values. REMOVE once Telegram works.
      - name: DEBUG - Telegram secret shape (temporary)
        if: steps.gate.outputs.should_run == 'true'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "TG_TOKEN length: ${#TG_TOKEN}"
          echo "TG_CHAT_ID length: ${#TG_CHAT_ID}"
          if printf '%s' "$TG_TOKEN" | grep -Eq '^[0-9]{8,10}:[A-Za-z0-9_-]{35}$'; then echo "TG_TOKEN shape: OK"; else echo "TG_TOKEN shape: BAD"; fi
          if printf '%s' "$TG_TOKEN" | grep -Eq '[[:space:]"'"'"']'; then echo "TG_TOKEN has whitespace/quote: YES"; else echo "TG_TOKEN has whitespace/quote: no"; fi
          if printf '%s' "$TG_CHAT_ID" | grep -Eq '^-?[0-9]+$'; then echo "TG_CHAT_ID numeric: yes"; else echo "TG_CHAT_ID numeric: NO"; fi

      - name: Stage 3 - AI synthesis + Telegram
        if: steps.gate.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # Reddit stays off - see config/sources.yml reddit.enabled: false.
          # If you ever get approved Reddit API access, flip that to true
          # and add REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET as secrets too.
        run: python3 run.py report

      - name: Show the report on the run summary page
        if: steps.gate.outputs.should_run == 'true'
        run: |
          latest="$(ls -t reports/*.md 2>/dev/null | head -1)"
          if [ -n "$latest" ]; then
            cat "$latest" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report file was written this run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the report back to the repo
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "data: daily report $(date -u +%F)"

          # BUG FIX: checkout@v4 can hand this job a commit ref that's
          # already stale by the time we get here - most commonly when a
          # run is triggered via "Re-run jobs" (reuses the ORIGINAL run's
          # pinned commit, not the current branch tip) rather than a fresh
          # "Run workflow" dispatch, but a genuinely fresh run landing
          # seconds after another one finishes could hit this too. A bare
          # `git push` then fails with "fetch first" - not a real conflict,
          # just a stale local ref. Rebase onto whatever's actually on
          # origin right now before pushing, retrying a few times in case
          # two runs race each other.
          for attempt in 1 2 3; do
            git fetch origin master
            if git rebase origin/master; then
              if git push origin master; then
                echo "Pushed on attempt $attempt."
                exit 0
              fi
            else
              git rebase --abort
              echo "Rebase conflict on attempt $attempt - unexpected for a"
              echo "single generated file, but not retrying blindly into it."
              exit 1
            fi
            echo "Push/rebase race on attempt $attempt, retrying..."
            sleep 5
          done
          echo "Still couldn't push after 3 attempts - see log above."
          exit 1
