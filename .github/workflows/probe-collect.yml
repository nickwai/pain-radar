# TEMPORARY (2026-10-07): verify CI's collect skips `fetch: local` feeds and
# merges data/local/latest.json. Collect stage only - no report, no Telegram,
# no commit. Delete after one run.
name: Probe collect (local feeds merge)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -q -r requirements.txt
      - run: python3 run.py collect
      - name: Count merged local-feed posts
        run: python3 -c "import json,glob,collections;f=sorted(glob.glob('data/raw/*.json'))[-1];p=json.load(open(f));print('LOCALCOUNT',collections.Counter(x['channel'] for x in p if x['channel'] in ('watchuseek','eurobricks','chinese-forums','lawnsite-bizops','contractortalk-biz')))"
