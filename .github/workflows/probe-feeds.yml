# TEMPORARY (2026-10-07): one-off probe of the 6 RSS feeds that answer 403/409
# from GitHub Actions but 200 from a home PC. Read-only GETs, prints status
# codes only. Delete after the result is recorded in the README.
name: Probe blocked feeds
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe each feed with several User-Agents
        run: |
          feeds=(
            "https://forum.purseblog.com/forums/-/index.rss"
            "https://www.watchuseek.com/forums/-/index.rss?order=post_date"
            "https://www.eurobricks.com/forum/index.php?/discover/all.xml"
            "https://www.chinese-forums.com/discover/all.xml"
            "https://www.lawnsite.com/forums/business-operations.20/index.rss?order=post_date"
            "https://www.contractortalk.com/forums/business.16/index.rss?order=post_date"
          )
          uas=(
            "Mozilla/5.0 (compatible; pain-radar/0.1; personal research script)"
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
            "Feedly/1.0 (+http://www.feedly.com/fetcher.html; like FeedFetcher-Google)"
          )
          for f in "${feeds[@]}"; do
            for i in "${!uas[@]}"; do
              code=$(curl -s -o /tmp/body -w "%{http_code}" -m 25 \
                -H "Accept: application/rss+xml, application/xml;q=0.9, */*;q=0.8" \
                -H "Accept-Language: en-US,en;q=0.9" \
                -A "${uas[$i]}" "$f")
              items=$(grep -c "<item>\|<entry>" /tmp/body || true)
              echo "PROBE ua$i $code items=$items $f"
              sleep 3
            done
          done
