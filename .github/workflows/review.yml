name: Pain Radar 2-week review

# Every second Friday (every second Thursday 2026-10-08 -> 10-22; moved
# to Fridays 2026-10-29, first Friday run 2026-10-30): digest of the last 14 days of reports - weekly ideas,
# competitor verdicts, pooled counts, source yield from Gemini triage -
# committed as reports/review-DATE.md + a short Telegram summary.
#
# Cron has no "every 2 weeks", so it fires every Friday and the gate runs
# only when the newest reports/review-*.md is 13+ days old (13, not 14, so
# a late Friday run never slips a whole week). Several crons because
# GitHub `schedule` fires late or gets dropped; the gate makes them
# idempotent. Next runs: 2026-10-30, 2026-11-13, 2026-11-27, ...
# Manual "Run workflow" always runs (and restarts the 2-week cycle).
on:
  schedule:
    - cron: "0 8 * * 5"
    - cron: "0 10 * * 5"
    - cron: "0 13 * * 5"
    - cron: "0 16 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate - 13+ days since the last review
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last="$(ls reports/review-*.md 2>/dev/null | sed -E 's/.*review-([0-9-]+)\.md/\1/' | sort | tail -1)"
          if [ -z "$last" ]; then
            echo "no earlier review - running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # One-time (2026-10-29): the move to Fridays starts the cycle on
          # Fri 2026-10-30, only 8 days after the last Thursday review.
          # Inert once any review dated 10-30 or later exists.
          first_friday="2026-10-30"
          if [[ "$last" < "$first_friday" ]] && [[ ! "$(date -u +%F)" < "$first_friday" ]]; then
            echo "last review $last - first Friday review, running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          if [ "$age" -ge 13 ]; then
            echo "last review $last ($age days ago) - running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "last review $last ($age days ago) - off week, skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: python3 -m pip install -r requirements.txt

      - name: Build digest + Telegram
        if: steps.gate.outputs.should_run == 'true'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 run.py review
          cat "$(ls -t reports/review-*.md | head -1)" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit the digest
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "data: 2-week review digest"
          for attempt in 1 2 3; do
            git fetch origin master
            if git rebase origin/master; then
              git push origin master && exit 0
            else
              git rebase --abort; exit 1
            fi
            sleep 5
          done
          exit 1
