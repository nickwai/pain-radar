# ============================================================
# THE WEIGHTS. Tune these to change what reaches your report.
# Bigger number = more influence. Rerun `python3 run.py filter`
# after any change and watch the shortlist move.
# ============================================================

weights:
  money: 3.0        # a phrase from keywords.yml `money`   - weighted highest, as you asked
  money_regex: 2.5  # an actual dollar amount - only counts alongside a real phrase
  pain: 1.5         # a phrase from keywords.yml `pain`
  engagement: 1.0   # replies + upvotes (only some sources report these)
  combo_bonus: 3.0  # pain AND money in the same post - the thing you actually want

# Stop one shouty post from dominating: cap how many hits count.
caps:
  money: 4
  money_regex: 2
  pain: 5
  engagement: 3.0

# Nudge whole industries up or down. Your own industries sit at 1.0+.
# `tech` is damped because Hacker News floods the pool.
group_multiplier:
  saas: 1.25        # people already paying a monthly bill
  ecommerce: 1.20   # merchants, real revenue at stake
  trading: 1.15
  automotive: 1.15
  automation: 1.10
  fashion: 1.10
  resell: 1.10
  asia: 1.10
  toys: 1.05
  mechanics: 1.15
  quant: 1.15
  money: 1.05
  webapps: 1.0
  tech: 0.75

shortlist:
  total: 40          # how many posts reach the AI stage (keeps token use tiny)
  max_per_group: 9   # stops any single industry taking over the report
  min_chars: 80      # posts shorter than this are noise, unless money is mentioned
  min_score: 2.5     # below this, not worth the AI's time
  max_gigs: 6        # hiring-pass posts (keywords.yml `hiring_regex`) added ON TOP
                     # of `total`, skipping score/quota. Keeps a flood of job ads
                     # from eating the token budget.
  # Small, high-value owner communities whose posts rarely use the generic
  # pain/money phrases (dealer ops, platform feature requests) - measured
  # 2026-09-26: 0 of 22 dealerrefresh and 0 of 12 ninjatrader posts passed.
  # These skip the signal/score test (exclude, duplicate and min_chars still
  # apply) and are added on top of `total`, best score first.
  always_channels:
    - dealerrefresh
    - forum.ninjatrader.com
    - community.tradovate.com
    - community.bunpro.jp
  max_always: 10

  # A bare "$45" in a sales listing is not a problem worth solving.
  # Require at least one real pain phrase OR one real money phrase.
  require_signal: true

# ============================================================
# STAGE 3 — the AI synthesis step. Gemini clusters the shortlist into
# distinct problems and scores each 1-5 on 4 axes; this section decides
# how those scores combine into the final ranking, and the hard filter
# a problem must clear to appear in the report at all.
# ============================================================

# Industries you can judge as real - edit this list any time, no code
# change. Gemini uses it to reject ideas outside what you know.
user_industries:
  - technology / tech automation
  - algorithmic and retail trading
  - toys and collectibles (Gunpla, LEGO, action figures, trading cards)
  - fashion (streetwear, resale, authentication)
  - automotive (repair, detailing, dealership operations)
  - Asian culture (import/proxy-buying, language learning, K/J/C fandom)

synthesis:
  # 1-5 axis weights -> one composite score. Money weighted highest,
  # per your original brief: it's the strongest signal someone will pay
  # for a fix, not just complain about the problem.
  weights:
    money_evidence: 3.0
    frequency: 1.0
    anger: 1.0
    ease_to_build: 1.0

  triage_enabled: true  # ADDED 2026-09-24: 2nd best-effort Gemini call per day that
                        # gives a verdict per shortlisted post -> reports/rejected/.
                        # Diagnostic only; set false to save one request/day.
  max_ideas: 5          # hard cap, per your brief
  second_pass: true     # ADDED 2026-09-26: re-cluster real_problem posts the first
                        # clustering call skipped (one extra Gemini request, only
                        # when there are any). Ideas from it are marked in the report.
  dedupe_days: 30       # ADDED 2026-09-26: skip ideas whose posts were ALL in a
                        # report in the last N days, and gigs already reported.
                        # Read from reports/DATE.md links. 0 = off.
  min_total_score: 8.0  # out of a 30 max (4+4+4+4 weighted) - below this, drop it.
                         # Raise this if the report feels padded with weak ideas.
                         # Lower it if you're getting "nothing today" too often.

  # Gemini's own judgment calls, applied as a hard filter before scoring
  # even matters - an idea failing any of these never reaches the report,
  # regardless of score:
  #   - near_user_industries: is this really in/near your list above?
  #   - buildable_two_weekends: could one person ship a rough version?
  #   - needs_team_or_capital_or_network_effect: the disqualifiers from
  #     your brief (a licence, a team, big upfront capital, a network
  #     effect) - if true, the idea is dropped no matter how it scores.

  model: gemini-3.5-flash-lite  # PINNED, not a "-latest" alias.
                           # Learned the hard way: "gemini-flash-latest"
                           # silently repointed to a brand-new preview model
                           # (gemini-3.8-flash) with a free-tier cap of only
                           # 20 requests/DAY - normal testing exhausted it in
                           # under an hour. A pinned, established model name
                           # doesn't move under you like that. Verified live
                           # (2026-09-23): works, no quota wall hit, handles
                           # the full schema correctly. If Google retires
                           # this one too, `python3 run.py check-gemini`
                           # would be worth adding - for now just re-verify
                           # with a plain curl before changing this value.
                           # Override with GEMINI_MODEL env var.
  thinking_budget:         # null = omit thinkingConfig entirely. Leave this
                           # blank/null unless you've verified your chosen
                           # model accepts the field - gemini-3.5-flash-lite
                           # returns a 400 INVALID_ARGUMENT if you set this,
                           # it doesn't just ignore it (confirmed live).
