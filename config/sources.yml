# ============================================================
# WHERE WE LOOK. Edit freely - no code changes needed.
# Add or delete a line, rerun. Every source here was tested
# and confirmed returning data on 2026-09-21.
# ============================================================

# How far back to look. 48 = catches weekends.
lookback_hours: 48

# ---------------------------------------------------------------
# REDDIT - OFF. Reddit killed self-serve API keys (Responsible
# Builder Policy). Public .json returns 403. RSS works but
# throttles to roughly 1 request per 4 minutes per IP.
# Flip enabled to true only if you get API creds approved.
# ---------------------------------------------------------------
reddit:
  enabled: false
  limit: 50
  endpoints: ["new", "top?t=day"]
  subreddits:
    trading: [algotrading, interactivebrokers, thetagang, options, Daytrading]
    automation: [msp, sysadmin, selfhosted, homeassistant, n8n]
    automotive: [MechanicAdvice, AskMechanics, Autobody, AutoDetailing]
    resell: [Flipping, Depop, poshmark, EtsySellers, Gunpla, lego]
    asia: [Taobao, AsianBeauty, ChineseLanguage, LearnJapanese, japanlife]

# ---------------------------------------------------------------
# DISCOURSE FORUMS - free /latest.json, generous limits.
# To add one: find any Discourse forum, paste its base URL.
# Test it first:  curl -s https://SITE/latest.json | head -c 200
# ---------------------------------------------------------------
discourse:
  page_size: 30
  max_pages: 3   # ADDED 2026-09-26: /latest.json returns only 30 topics - on a busy
                 # forum (n8n) that is ~18h, shorter than lookback_hours. Keep paging
                 # while the oldest topic is still inside the lookback, up to this cap.
                 # Quiet forums stop after page 1 (no extra requests).
  forums:
    - url: https://forum.alpaca.markets        # trading APIs, brokers
      group: trading
    - url: https://community.home-assistant.io # home automation
      group: automation
    - url: https://community.n8n.io            # workflow automation
      group: automation
    - url: https://discourse.nodered.org       # flow automation
      group: automation
    - url: https://forum.openwrt.org           # networking
      group: automation
    - url: https://forum.obsidian.md           # knowledge tools
      group: automation
    - url: https://forum.ghost.org             # publishing / creators
      group: automation
    - url: https://community.frame.work        # repairable hardware
      group: automotive
    - url: https://community.wanikani.com      # Japanese learning
      group: asia
    # --- users here pay a monthly bill. strongest money signal we have. ---
    - url: https://forum.bubble.io                # no-code, $29-529/mo plans
      group: saas
    - url: https://community.make.com             # automation, paid tiers
      group: saas
    - url: https://community.retool.com           # internal tools, per-seat pricing
      group: saas
    - url: https://community.baserow.io           # Airtable alternative, paid tiers
      group: saas
    - url: https://community.nocodb.com           # Airtable alternative, paid tiers
      group: saas
    - url: https://community.shopify.dev          # devs building for paying merchants
      group: ecommerce
    # --- ADDED 2026-09-24 after probing 30 candidates by keyword pass-rate.
    # forum.cursor.com + community.openai.com were added then REMOVED the same
    # day: they passed the keyword filter (20-23%) but Gemini's per-post
    # triage found 0 real problems in 9 shortlisted posts - all vendor bug
    # reports / billing glitches only the vendor can fix. Keyword pass-rate
    # is NOT the same as real problems; judge sources by the triage yield
    # table in reports/rejected/. These three are small samples (n=4-21/wk),
    # unproven - re-check the yield table after a week and cut what shows 0.
    - url: https://community.fly.io                # paid hosting, per-usage bills
      group: saas
    - url: https://community.coda.io               # docs/automation, paid tiers
      group: saas
    - url: https://community.glideapps.com         # no-code apps, paid tiers
      group: saas
    # Added 2026-09-26 - seller/owner communities in YOUR industries (probed 45,
    # these passed). Low volume; listed in scoring.yml always_channels.
    - url: https://forum.ninjatrader.com           # paid trading platform, ~3/day
      group: trading
    - url: https://community.tradovate.com         # futures broker feature requests, <1/day
      group: trading
    - url: https://community.bunpro.jp             # paid Japanese-learning SRS, ~1.5/day
      group: asia

# ---------------------------------------------------------------
# RSS / ATOM FEEDS - niche forums, very few builders watching.
# Most XenForo forums expose:  SITE/forums/-/index.rss
# ---------------------------------------------------------------
rss:
  # COVERAGE FIX 2026-09-26: default forum feeds list the latest REPLIES, so a busy
  # forum's feed spanned minutes (bogleheads 0.2h, hardwarezone 0.1h of the 48h
  # lookback). Switched to "new threads" feeds where the software has one:
  #   XenForo  ?order=post_date   phpBB  ?mode=topics   Invision  paged (page_url)
  # Measured span after -> before is noted on each feed. Re-measure with
  # the probe in README if a feed looks thin.
  feeds:
    - url: https://www.elitetrader.com/et/forums/-/index.rss?order=post_date   # 84h (was 13.7h)
      name: elitetrader
      group: trading
    - url: https://www.trade2win.com/forums/-/index.rss?order=post_date   # full window, ~1 new thread/48h
      also_urls: [https://www.trade2win.com/forums/-/index.rss]   # + recent replies (~10h)
      name: trade2win
      group: trading
    - url: https://www.bogleheads.org/forum/feed.php?mode=topics   # 18.9h (was 0.2h)
      name: bogleheads
      group: trading
    - url: https://www.garagejournal.com/forum/forums/-/index.rss?order=post_date   # 52h (was 1.9h)
      name: garagejournal
      group: automotive
    - url: https://forum.purseblog.com/forums/-/index.rss   # 403 on every variant 2026-09-26
      name: purseblog          # buyers pay for authentication services
      group: fashion
    - url: https://www.styleforum.net/forums/-/index.rss   # 7.2h; ?order=post_date returns 1 spam item
      name: styleforum
      group: fashion
    - url: https://www.watchuseek.com/forums/-/index.rss?order=post_date   # 9.7h (was 0.6h)
      name: watchuseek         # flippers, dealers, real money
      group: resell
    - url: https://www.eurobricks.com/forum/index.php?/discover/all.xml
      page_url: "https://www.eurobricks.com/forum/index.php?/discover/all.xml/&page={page}"
      max_pages: 4             # ~2.7h/page, all activity; 4 pages ~11h (was 2.7h)
      name: eurobricks
      group: toys
    - url: https://forums.hardwarezone.com.sg/forums/-/index.rss?order=post_date   # 2.7h (was 0.1h) - huge forum
      name: hardwarezone
      group: asia
    - url: https://www.chinese-forums.com/discover/all.xml
      name: chinese-forums
      group: asia
    - url: https://forum.dealerrefresh.com/forums/-/index.rss?order=post_date
      name: dealerrefresh      # car dealership ops (CRM, leads, photos), ~3/day - added 2026-09-26
      group: automotive
    - url: https://wordpress.org/support/plugin/woocommerce/feed
      name: woocommerce        # shop owners' store problems, long posts - added 2026-09-26
      group: ecommerce

# ---------------------------------------------------------------
hackernews:
  hits_per_query: 1000  # Algolia max. Was 30 = ~2h of the 48h window (2026-09-26).
  phrase_match: true    # keep only hits containing the EXACT query phrase. Algolia's
                        # own matching is loose: ~1% of "we pay for" hits had the
                        # phrase. Quoted/advancedSyntax search returns ~0 (stop words).
  ask_hn: true          # ADDED 2026-09-26: every Ask HN story in the window (~30/day),
                        # no phrase filter - they are questions by nature, and the best
                        # HN pain threads live there ("Who's still keeping a DOS machine
                        # up because the business depends on it?", 166 comments).
  # Phrases, matched EXACTLY in the text (phrase_match). Reworded 2026-09-26 from
  # 48h counts: the old long phrases ("we pay for", "is there a tool for") had
  # 0-1 exact hits. Dropped "manually"/"spreadsheet": 55/34 hits, all coding chatter.
  queries:
    - "alternative to"     # 23 hits/48h
    - "too expensive"      # 17
    - "willing to pay"     # 13
    - "per month"          # 11
    - "a month for"        # 6
    - "wish there was an"  # ~3 ("an alternative to carbonite")
    - "price hike"         # 3
    - "overpriced"         # 3
    - "pricing is"         # 3
    - "vendor lock-in"     # 2

lobsters:
  enabled: true

stackexchange:
  # Free without a key: 300 requests/day per IP. We use ~4.
  page_size: 30
  sites:
    - mechanics
    - quant
    - money
    - webapps
