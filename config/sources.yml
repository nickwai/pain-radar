# ---------------------------------------------------------------
hackernews:
  hits_per_query: 30
  # Phrases that mean "money is moving and the tool is bad", not plain nouns.
  queries:
    - "we pay for"
    - "paying per month"
    - "too expensive for"
    - "switched away from"
    - "cheaper alternative to"
    - "still doing this manually"
    - "spreadsheet hell"
    - "is there a tool for"
    - "wish there was a tool"
    - "hate our current"

lobsters:
  enabled: true

stackexchange:
  # Free without a key: 300 requests/day per IP. We use ~4.
  page_size: 30
  sites:
    - mechanics
    - quant
    - money
    - webapps
